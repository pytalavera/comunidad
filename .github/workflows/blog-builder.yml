name: Build Blog from Markdown

on:
  push:
    paths:
      - 'blog/posts/*.md'
      - '.github/workflows/blog-builder.yml'
      - 'scripts/generate-blog.js'
      - 'blog/templates/*.html'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install gray-matter marked

      - name: Generate blog HTML files
        run: |
          node scripts/generate-blog.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code blog/posts/*.html blog.html || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push generated files
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add blog/posts/*.html blog.html
          git commit -m "Auto-generate blog from markdown [skip ci]"
          git push
