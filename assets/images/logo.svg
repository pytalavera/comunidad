<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="python-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Talavera tile background circle -->
  <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>

  <!-- Decorative border pattern -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Python snake inspired shape (simplified) -->
  <g transform="translate(100, 100)">
    <!-- Upper half (blue) -->
    <path d="M -30,-40 Q -50,-40 -50,-20 L -50,10 Q -50,20 -40,20 L 10,20 Q 20,20 20,10 L 20,-20 Q 20,-40 0,-40 Z"
          fill="#1E3A8A" opacity="0.9"/>

    <!-- Lower half (orange) -->
    <path d="M 30,40 Q 50,40 50,20 L 50,-10 Q 50,-20 40,-20 L -10,-20 Q -20,-20 -20,-10 L -20,20 Q -20,40 0,40 Z"
          fill="#D97706" opacity="0.9"/>

    <!-- Eyes -->
    <circle cx="-25" cy="-25" r="4" fill="#FFFFFF"/>
    <circle cx="25" cy="25" r="4" fill="#FFFFFF"/>
    <circle cx="-25" cy="-25" r="2" fill="#1F2937"/>
    <circle cx="25" cy="25" r="2" fill="#1F2937"/>
  </g>

  <!-- Decorative Talavera dots around -->
  <circle cx="100" cy="20" r="4" fill="#F59E0B"/>
  <circle cx="180" cy="100" r="4" fill="#059669"/>
  <circle cx="100" cy="180" r="4" fill="#F59E0B"/>
  <circle cx="20" cy="100" r="4" fill="#059669"/>

  <!-- Text: PyTalavera -->
  <text x="100" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1E3A8A">PyTalavera</text>
</svg>
