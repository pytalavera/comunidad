<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="talavera-bg" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Subtle background pattern -->
      <rect width="100" height="100" fill="#FFFFFF"/>

      <!-- Floral motifs -->
      <g opacity="0.1">
        <circle cx="25" cy="25" r="8" fill="#1E3A8A"/>
        <circle cx="75" cy="25" r="8" fill="#D97706"/>
        <circle cx="25" cy="75" r="8" fill="#D97706"/>
        <circle cx="75" cy="75" r="8" fill="#1E3A8A"/>

        <!-- Small connecting elements -->
        <circle cx="50" cy="50" r="5" fill="#7C3AED"/>
        <circle cx="50" cy="0" r="3" fill="#7C3AED"/>
        <circle cx="100" cy="50" r="3" fill="#7C3AED"/>
        <circle cx="50" cy="100" r="3" fill="#7C3AED"/>
        <circle cx="0" cy="50" r="3" fill="#7C3AED"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#talavera-bg)"/>
</svg>
