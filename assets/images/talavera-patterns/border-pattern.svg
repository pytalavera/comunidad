<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" preserveAspectRatio="none">
  <defs>
    <pattern id="talavera-border" x="0" y="0" width="200" height="40" patternUnits="userSpaceOnUse">
      <!-- Blue geometric pattern -->
      <rect x="0" y="0" width="200" height="40" fill="#FFFFFF"/>
      <circle cx="20" cy="20" r="8" fill="#1E3A8A"/>
      <circle cx="60" cy="20" r="8" fill="#D97706"/>
      <circle cx="100" cy="20" r="8" fill="#1E3A8A"/>
      <circle cx="140" cy="20" r="8" fill="#D97706"/>
      <circle cx="180" cy="20" r="8" fill="#1E3A8A"/>

      <!-- Connecting lines -->
      <line x1="28" y1="20" x2="52" y2="20" stroke="#7C3AED" stroke-width="2"/>
      <line x1="68" y1="20" x2="92" y2="20" stroke="#7C3AED" stroke-width="2"/>
      <line x1="108" y1="20" x2="132" y2="20" stroke="#7C3AED" stroke-width="2"/>
      <line x1="148" y1="20" x2="172" y2="20" stroke="#7C3AED" stroke-width="2"/>

      <!-- Small accent dots -->
      <circle cx="40" cy="10" r="3" fill="#F59E0B"/>
      <circle cx="80" cy="10" r="3" fill="#F59E0B"/>
      <circle cx="120" cy="10" r="3" fill="#F59E0B"/>
      <circle cx="160" cy="10" r="3" fill="#F59E0B"/>
      <circle cx="40" cy="30" r="3" fill="#F59E0B"/>
      <circle cx="80" cy="30" r="3" fill="#F59E0B"/>
      <circle cx="120" cy="30" r="3" fill="#F59E0B"/>
      <circle cx="160" cy="30" r="3" fill="#F59E0B"/>
    </pattern>
  </defs>
  <rect width="200" height="40" fill="url(#talavera-border)"/>
</svg>
